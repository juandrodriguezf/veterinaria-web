spring.application.name=Vetopia
server.port=8080

# ==============================================================
# URLS PARA VISUALIZAR (arrancar antes con: mvn spring-boot:run)
#   Landing institucional : http://localhost:8080/
#   Login                 : http://localhost:8080/login.html
#   Listado de mascotas   : http://localhost:8080/mascotas
#   Detalle de mascota    : http://localhost:8080/mascotas/detalle?id=2
# ==============================================================

# Locale en español para el formato de fechas de Thymeleaf (#temporals)
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Desactivar caché de plantillas durante el desarrollo
spring.thymeleaf.cache=false
