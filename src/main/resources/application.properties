spring.application.name=Vetopia
server.port=8080

# Seguridad JWT: vigencia del token. La clave HS512 se genera aleatoriamente
# al arrancar y vive en memoria, como en la clase.
app.jwt.expiracion-ms=3600000


# Perfil activo: define la base de datos que usa la aplicación.
#   h2  -> base de datos H2 en archivo (application-h2.properties)
spring.profiles.active=h2
