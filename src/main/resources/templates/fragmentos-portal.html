<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Head del portal (Material Design 3) -->
<th:block th:fragment="head">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vetopia - Hospital Veterinario del Futuro</title>
    <link href="/css/tailwind-portal.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
    <!-- Los design tokens del tema ya viven compilados en tailwind-portal.css;
         el script tailwind.config del CDN era un resto del prototipo y no
         hace falta (provocaba "tailwind is not defined" en consola). -->
    <link href="css/styles.css" rel="stylesheet"/>
</th:block>

<!-- Footer del portal del cliente -->
<footer th:fragment="footer" class="bg-[#0f1115] text-white py-12">
    <div class="max-w-container-max mx-auto flex flex-col md:flex-row items-center justify-between gap-8 px-gutter">
        <a class="flex items-center" href="#">
            <img alt="Vetopia Logo" class="h-10 w-auto object-contain" th:src="@{/images/logo_Vetopia.png}"/>
        </a>
        <div class="flex items-center justify-center gap-x-12 whitespace-nowrap font-label-md text-label-md uppercase tracking-widest text-gray-300 w-full md:w-auto">
            <a class="hover:text-primary transition-colors" href="#">Política de Privacidad</a>
            <a class="hover:text-primary transition-colors" href="#">Términos de Servicio</a>
            <a class="hover:text-primary transition-colors" href="#">Protocolo de Emergencia</a>
        </div>
        <div class="text-xs uppercase tracking-widest text-gray-400 text-center md:text-right">
            <p>&copy; 2026 VETOPIA. CARE FOR THE NEXT GENERATION.</p>
        </div>
    </div>
</footer>

</body>
</html>
