<!DOCTYPE html>

<!--
    Vista Thymeleaf 
    URLs:
      http://localhost:8080/veterinario/mascotas/clientes/crear  (crear)
      http://localhost:8080/veterinario/mascotas/clientes/editar?id=N  (editar)
    Controlador: VeterinarioMascotaController.crearCliente() / editarCliente()
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragmentos-portal :: head"></div>
    <title>Vetopia - Formulario de Cliente</title>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<nav class="w-full top-0 sticky bg-[#0f1115] shadow-sm z-50">
    <div class="flex justify-between items-center w-full px-gutter max-w-container-max mx-auto h-20">
        <a href="/" class="flex items-center">
            <img th:src="@{/images/logo_Vetopia.png}" alt="Vetopia Logo" class="h-8 w-auto object-contain"/>
        </a>
        <div class="hidden md:flex items-center gap-8">
            <a href="/veterinario/mascotas" class="text-gray-400 hover:text-primary transition-colors font-body-md text-body-md">Pacientes</a>
            <a href="/veterinario/mascotas/clientes" class="text-primary font-body-md text-body-md font-bold border-b-2 border-primary pb-1">Clientes</a>
            <a href="#" class="text-gray-400 hover:text-primary transition-colors font-body-md text-body-md">Citas</a>
            <a href="#" class="text-gray-400 hover:text-primary transition-colors font-body-md text-body-md">Tratamientos</a>
        </div>
        <div class="flex items-center gap-4">
            <a href="/login" class="hidden md:inline-flex px-6 py-3 rounded-full border border-gray-600 text-white hover:bg-white/10 transition-colors font-button text-button uppercase tracking-wider items-center gap-2">
                Logout
            </a>
        </div>
    </div>
</nav>

<main class="flex-1">
    <div class="max-w-container-max mx-auto px-gutter py-stack-lg">
        <!-- Título y subtítulo -->
        <div class="mb-stack-lg">
            <h1 class="text-headline-xl font-headline-xl text-on-surface mb-1"
                th:text="${dueno.id != null} ? 'Editar Cliente' : 'Registrar Nuevo Cliente'"></h1>
            <p class="text-body-lg font-body-lg text-on-surface-variant">Completar los detalles del cliente</p>
        </div>

        <!-- Formulario: th:object vincula el Dueno del modelo -->
        <form th:object="${dueno}" th:action="@{/veterinario/mascotas/clientes/guardar}" method="post"
              class="flex flex-col gap-stack-lg">
            <!-- Id oculto: null en creación, precargado en edición -->
            <input type="hidden" th:field="*{id}"/>

            <div class="bg-surface-container-lowest p-8 rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.04)] border border-outline-variant">
                <div class="border-b border-surface-container-highest pb-4 mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 bg-primary rounded-full"></div>
                        <h2 class="text-headline-lg font-headline-lg text-on-surface">Información del Cliente</h2>
                    </div>
                </div>

                <div class="flex flex-col gap-6">
                    <!-- Cédula y Nombre -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label for="cedula" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Cédula (ID)</label>
                            <input th:field="*{cedula}" id="cedula" type="text"
                                   class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                   placeholder="e.g. 1234567890"/>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="nombre" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Nombre Completo</label>
                            <input th:field="*{nombre}" id="nombre" type="text"
                                   class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                   placeholder="e.g. Maria Gonzalez"/>
                        </div>
                    </div>

                    <!-- Correo y Contraseña -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label for="correo" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Email</label>
                            <input th:field="*{correo}" id="correo" type="email"
                                   class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                   placeholder="maria@example.com"/>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="contrasena" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Contraseña</label>
                            <input th:field="*{contrasena}" id="contrasena" type="password"
                                   class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                   placeholder="Credencial para el login del cliente"/>
                        </div>
                    </div>

                    <!-- Celular y Estado -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2">
                            <label for="celular" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Número de Teléfono</label>
                            <input th:field="*{celular}" id="celular" type="tel"
                                   class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                   placeholder="+1 (555) 000-0000"/>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="estado" class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Estado</label>
                            <select th:field="*{estado}" id="estado"
                                    class="w-full px-4 py-3 bg-background rounded border border-outline-variant text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de acción -->
            <div class="flex flex-wrap items-center justify-end gap-4 pt-6 border-t border-outline-variant">
                <a href="/veterinario/mascotas/clientes" class="px-6 py-3 rounded-full border border-outline text-on-surface font-button text-button uppercase hover:bg-surface-container-high transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="inline-flex items-center gap-2 rounded-full bg-primary-container px-8 py-3 font-button text-button uppercase text-on-primary-container transition-colors hover:bg-primary hover:text-on-primary">
                    <span class="material-symbols-outlined text-lg">save</span>
                    <span th:text="${dueno.id != null} ? 'Actualizar Cliente' : 'Registrar Cliente'"></span>
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="fragmentos-portal :: footer"></footer>
</body>
</html>
