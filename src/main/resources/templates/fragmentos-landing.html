<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Head de la landing page (dark mode) -->
<th:block th:fragment="head">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vetopia - Hospital Veterinario del Futuro</title>
    <link href="/css/tailwind-landing.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
    <!-- Los design tokens del tema de la landing ya viven compilados en
         tailwind-landing.css; el script tailwind.config del CDN era un
         resto del prototipo y no hace falta (provocaba "tailwind is not
         defined" en consola). -->
    <link href="css/styles.css" rel="stylesheet"/>
</th:block>

<!-- Footer de la landing page (con redes sociales) -->
<footer th:fragment="footer" class="bg-deep-carbon border-t border-white/10 py-section-gap">
    <div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop">
        <div class="flex flex-col md:flex-row items-center justify-between gap-8 pb-12 border-b border-white/10">
            <a class="flex items-center" href="#">
                <img alt="Vetopia Logo" class="h-10 w-auto object-contain" th:src="@{/images/logo_Vetopia.png}"/>
            </a>
            <div class="flex flex-wrap justify-center gap-x-12 gap-y-4 font-label-sm text-label-sm uppercase tracking-widest text-gray-300 w-full md:w-auto">
                <a class="hover:text-primary transition-colors" href="#">Política de Privacidad</a>
                <a class="hover:text-primary transition-colors" href="#">Términos de Servicio</a>
                <a class="hover:text-primary transition-colors" href="#">Protocolo de Emergencia</a>
            </div>
            <div class="text-xs uppercase tracking-widest text-gray-400 text-center md:text-right">
                <p>&copy; 2026 VETOPIA. CARE FOR THE NEXT GENERATION.</p>
            </div>
        </div>
        <div class="flex justify-center gap-8 mt-10 text-xs font-label-sm text-label-sm uppercase tracking-widest text-gray-400">
            <a class="flex items-center gap-2 hover:text-white transition-colors" href="#">
                <svg fill="currentColor" height="18" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                Facebook
            </a>
            <a class="flex items-center gap-2 hover:text-white transition-colors" href="#">
                <svg fill="currentColor" height="18" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><rect fill="none" height="20" rx="5" ry="5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="20" x="2" y="2"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><line stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line></svg>
                Instagram
            </a>
        </div>
    </div>
</footer>

</body>
</html>
