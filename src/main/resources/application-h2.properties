
# PERFIL H2: base de datos en archivo junto al proyecto.
# El esquema se genera desde las entidades JPA al arrancar y los
# datos se siembran con DataLoader (se reinician en cada arranque).

# Datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./mydatabase
spring.datasource.username=sa
spring.datasource.password=

# Consola de administración de H2 (http://localhost:8080/h2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Generar el esquema desde las entidades
spring.jpa.generate-ddl=true
# Borrar y recrear las tablas en cada arranque (datos de prueba)
spring.jpa.hibernate.ddl-auto=create-drop

# Logging SQL para depuración
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true
