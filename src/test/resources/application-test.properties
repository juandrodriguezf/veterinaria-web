# Perfil "test": base de datos H2 en memoria para pruebas automatizadas.
# No se usa la base de datos de archivo del perfil "h2" (mydatabase).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Se crean y borran las tablas en cada reinicio del contexto de pruebas.
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Se desactiva la inicializacion por scripts data.sql/schema.sql.
spring.sql.init.mode=never
