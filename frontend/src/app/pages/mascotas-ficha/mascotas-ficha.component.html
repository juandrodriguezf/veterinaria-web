<div class="bg-portal-background text-portal-on-background font-portal-body-md min-h-screen flex flex-col">
  <app-portal-header [usuario]="nombreVeterinario" activo="mascotas"></app-portal-header>

  <main class="flex-grow w-full max-w-portal-container-max mx-auto px-portal-gutter py-portal-stack-lg">
    @if (mascota; as m) {
      <section>
        <app-ficha-encabezado [mascota]="m" (alternar)="alternarEstado()"></app-ficha-encabezado>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-portal-stack-lg items-stretch mb-portal-stack-lg">
          <app-ficha-datos [mascota]="m"></app-ficha-datos>
          <app-ficha-propietario [dueno]="m.dueno"></app-ficha-propietario>
        </div>

        <div class="flex justify-end mb-4">
          <a class="inline-flex items-center gap-2 rounded-full bg-portal-primary-container px-6 py-3 font-portal-button text-portal-button uppercase text-portal-on-primary-container transition-colors hover:bg-portal-primary hover:text-portal-on-primary"
             [queryParams]="{ mascotaId: m.id }" routerLink="/tratamiento/asignar">
            Asignar tratamiento
            <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">vaccines</span>
          </a>
        </div>

        <app-ficha-historial [tratamientos]="m.tratamientos"></app-ficha-historial>
      </section>
    } @else {
      <section class="bg-portal-surface-container-lowest rounded-portal-xl border border-portal-surface-container-highest shadow-[0px_10px_30px_rgba(0,0,0,0.04)] p-portal-stack-lg text-center">
        <span class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-portal-surface-container-high">
          <span class="material-symbols-outlined text-[32px] text-portal-outline" style="font-variation-settings: 'FILL' 0;">search_off</span>
        </span>
        <h1 class="font-portal-headline-lg text-portal-headline-lg text-portal-on-surface mb-2">Mascota no encontrada</h1>
        <p class="max-w-xl mx-auto font-portal-body-lg text-portal-body-lg text-portal-on-surface-variant mb-8">{{ mensajeError }}</p>
        <a class="inline-flex items-center gap-2 rounded-full bg-portal-primary-container px-6 py-3 font-portal-button text-portal-button uppercase text-portal-on-primary-container transition-colors hover:bg-portal-primary hover:text-portal-on-primary" routerLink="/mascotas">
          Ver mis mascotas
          <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
        </a>
      </section>
    }
  </main>

  <app-footer-portal></app-footer-portal>
</div>
