<div class="bg-portal-background text-portal-on-background font-portal-body-md min-h-screen flex flex-col">
  <app-portal-header [usuario]="nombreVeterinario" activo="tratamientos"></app-portal-header>

  <main class="flex-1">
    <div class="max-w-portal-container-max mx-auto px-portal-gutter py-portal-stack-lg">
      <div class="max-w-[768px] mx-auto">
        <div class="mb-portal-stack-lg">
          <div class="flex items-center gap-3">
            <div class="w-6 h-6 bg-portal-primary rounded-full"></div>
            <h1 class="font-portal-headline-lg text-portal-headline-lg text-portal-on-surface">Asignar Nuevo Tratamiento</h1>
          </div>
          <p class="font-portal-body-lg text-portal-body-lg text-portal-on-surface-variant mt-1">Portal Veterinario / Registro Clínico</p>
        </div>

        @if (mensajeError) {
          <div class="mb-6 p-4 rounded-portal-xl border border-portal-error bg-portal-error-container text-portal-on-error-container" role="alert">
            <p class="font-portal-body-md text-portal-body-md">{{ mensajeError }}</p>
          </div>
        }

        <app-tratamiento-form
          [form]="form"
          [mascotas]="mascotas"
          [drogas]="drogas"
          [nombreVeterinario]="nombreVeterinario"
          (aplicar)="aplicar()"></app-tratamiento-form>
      </div>
    </div>
  </main>

  <app-footer-portal></app-footer-portal>

  <!-- Modal de confirmación (Tratamiento Aplicado) -->
  @if (drogaAplicada; as droga) {
    <app-tratamiento-modal [droga]="droga" [mascotaId]="mascotaIdAplicada" (cerrar)="cerrarConfirmacion()"></app-tratamiento-modal>
  }
</div>
